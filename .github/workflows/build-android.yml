name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '!frontend/ios/**'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      EXPO_PUBLIC_HA_URL: ${{ secrets.EXPO_PUBLIC_HA_URL }}
      EXPO_PUBLIC_HA_TOKEN: ${{ secrets.EXPO_PUBLIC_HA_TOKEN }}
      EXPO_PUBLIC_GEMINI_API_KEY: ${{ secrets.EXPO_PUBLIC_GEMINI_API_KEY }}
      EXPO_PUBLIC_BRIDGE_URL: ${{ secrets.EXPO_PUBLIC_BRIDGE_URL }}
      EXPO_PUBLIC_BRIDGE_PIN: ${{ secrets.EXPO_PUBLIC_BRIDGE_PIN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build debug APK (arm64 only)
        run: |
          cd android
          ./gradlew assembleDebug \
            -x lint -x test \
            -PreactNativeArchitectures=arm64-v8a

      - uses: actions/upload-artifact@v4
        with:
          name: ozzu-android
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
