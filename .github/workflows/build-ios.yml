name: Build iOS IPA

on:
  workflow_dispatch: # Manual trigger from GitHub UI

permissions:
  contents: write   # publish the IPA to the ios-latest Release (bypasses the artifact-storage quota)

jobs:
  build-ios:
    runs-on: macos-15
    defaults:
      run:
        working-directory: frontend
    env:
      EXPO_PUBLIC_HA_URL: ${{ secrets.EXPO_PUBLIC_HA_URL }}
      EXPO_PUBLIC_HA_TOKEN: ${{ secrets.EXPO_PUBLIC_HA_TOKEN }}
      EXPO_PUBLIC_GEMINI_API_KEY: ${{ secrets.EXPO_PUBLIC_GEMINI_API_KEY }}
      EXPO_PUBLIC_BRIDGE_URL: ${{ secrets.EXPO_PUBLIC_BRIDGE_URL }}
      EXPO_PUBLIC_BRIDGE_PUBLIC_URL: ${{ secrets.EXPO_PUBLIC_BRIDGE_PUBLIC_URL }}
      EXPO_PUBLIC_BRIDGE_API_KEY: ${{ secrets.EXPO_PUBLIC_BRIDGE_API_KEY }}
      EXPO_PUBLIC_BRIDGE_PIN: ${{ secrets.EXPO_PUBLIC_BRIDGE_PIN }}
      EXPO_PUBLIC_META_APP_ID: ${{ secrets.EXPO_PUBLIC_META_APP_ID }}
      EXPO_PUBLIC_META_CLIENT_TOKEN: ${{ secrets.EXPO_PUBLIC_META_CLIENT_TOKEN }}
      EXPO_PUBLIC_META_TEAM_ID: G7PCS9PALV
      GITHUB_TOKEN: ${{ secrets.META_GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Write .env from secrets
        run: |
          echo "EXPO_PUBLIC_HA_URL=${EXPO_PUBLIC_HA_URL}" > .env
          echo "EXPO_PUBLIC_HA_TOKEN=${EXPO_PUBLIC_HA_TOKEN}" >> .env
          echo "EXPO_PUBLIC_GEMINI_API_KEY=${EXPO_PUBLIC_GEMINI_API_KEY}" >> .env
          echo "EXPO_PUBLIC_BRIDGE_URL=${EXPO_PUBLIC_BRIDGE_URL}" >> .env
          echo "EXPO_PUBLIC_BRIDGE_PUBLIC_URL=${EXPO_PUBLIC_BRIDGE_PUBLIC_URL}" >> .env
          echo "EXPO_PUBLIC_BRIDGE_API_KEY=${EXPO_PUBLIC_BRIDGE_API_KEY}" >> .env
          echo "EXPO_PUBLIC_BRIDGE_PIN=${EXPO_PUBLIC_BRIDGE_PIN}" >> .env

      - name: Bump iOS buildNumber from GITHUB_RUN_NUMBER
        run: |
          # Every IPA must have a unique CFBundleVersion or SideStore can't tell
          # builds apart. We use GITHUB_RUN_NUMBER (monotonically increasing per
          # workflow). The version (1.0.0) stays semantic; only buildNumber bumps.
          jq --arg bn "$GITHUB_RUN_NUMBER" '.expo.ios.buildNumber = $bn' app.json > app.json.new
          mv app.json.new app.json
          echo "buildNumber set to $(jq -r '.expo.ios.buildNumber' app.json)"
          echo "version is $(jq -r '.expo.version' app.json)"

      - name: Generate native iOS project (phone config)
        run: BUILD_TARGET=phone npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        run: cd ios && pod install

      - name: Build unsigned archive
        run: |
          xcodebuild \
            -workspace ios/ozzu.xcworkspace \
            -scheme ozzu \
            -configuration Release \
            -sdk iphoneos \
            -destination generic/platform=iOS \
            -archivePath build/ozzu.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          cd build/ozzu.xcarchive/Products
          mv Applications Payload
          zip -r ../../../ozzu.ipa Payload

      - name: Write build metadata sidecar
        run: |
          # Cipher's bridge reads this sidecar to serve the SideStore source
          # manifest with truthful version/buildNumber matching what's actually
          # baked into the IPA's Info.plist (CFBundleShortVersionString + CFBundleVersion).
          cat > ozzu-build-meta.json <<EOF
          {
            "version": "$(jq -r .expo.version app.json)",
            "buildNumber": "$GITHUB_RUN_NUMBER",
            "runId": "$GITHUB_RUN_ID",
            "sha": "$GITHUB_SHA",
            "builtAt": "$(date -u +%FT%TZ)"
          }
          EOF
          cat ozzu-build-meta.json

      - name: Publish IPA + metadata to the ios-latest Release
        # actions/upload-artifact recurringly fails with "Artifact storage quota has
        # been hit"; Release assets have a SEPARATE quota. Idempotent: ensure the
        # rolling release exists, then clobber-upload the IPA + meta sidecar.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ios-latest >/dev/null 2>&1 || \
            gh release create ios-latest --title "iOS latest IPA" \
              --notes "Rolling latest iOS build (auto-updated by build-ios.yml)" --prerelease
          gh release upload ios-latest \
            frontend/ozzu.ipa frontend/ozzu-build-meta.json --clobber
