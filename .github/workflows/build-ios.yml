name: Build iOS IPA

on:
  workflow_dispatch: # Manual trigger from GitHub UI

jobs:
  build-ios:
    runs-on: macos-15
    defaults:
      run:
        working-directory: frontend
    env:
      EXPO_PUBLIC_HA_URL: ${{ secrets.EXPO_PUBLIC_HA_URL }}
      EXPO_PUBLIC_HA_TOKEN: ${{ secrets.EXPO_PUBLIC_HA_TOKEN }}
      EXPO_PUBLIC_GEMINI_API_KEY: ${{ secrets.EXPO_PUBLIC_GEMINI_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate native iOS project (phone config)
        run: BUILD_TARGET=phone npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        run: cd ios && pod install

      - name: Build unsigned archive
        run: |
          xcodebuild \
            -workspace ios/ozzu.xcworkspace \
            -scheme ozzu \
            -configuration Release \
            -sdk iphoneos \
            -destination generic/platform=iOS \
            -archivePath build/ozzu.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          cd build/ozzu.xcarchive/Products
          mv Applications Payload
          zip -r ../../../ozzu.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ozzu-ios
          path: frontend/ozzu.ipa
          retention-days: 30
