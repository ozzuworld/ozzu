name: Build AgroVisión APK

on:
  workflow_dispatch:

jobs:
  build-agrovision:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agrovision-app
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agrovision-app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build release APK
        run: |
          cd android
          ./gradlew assembleRelease \
            -x lint -x test \
            -x checkReleaseDuplicateClasses \
            -PreactNativeArchitectures=armeabi-v7a,arm64-v8a

      - uses: actions/upload-artifact@v4
        with:
          name: agrovision-apk
          path: agrovision-app/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
