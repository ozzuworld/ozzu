name: Build Ozzu TV APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tv/**'

jobs:
  build-tv:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # publish the APK as a Release asset (see final step)
    defaults:
      run:
        working-directory: tv
    env:
      EXPO_PUBLIC_BRIDGE_URL: ${{ secrets.EXPO_PUBLIC_BRIDGE_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tv/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      - name: Write .env
        run: |
          echo "EXPO_PUBLIC_BRIDGE_URL=${EXPO_PUBLIC_BRIDGE_URL}" > .env

      - name: Decode keystore
        if: env.OZZU_TV_KEYSTORE_BASE64 != ''
        env:
          OZZU_TV_KEYSTORE_BASE64: ${{ secrets.OZZU_TV_KEYSTORE_BASE64 }}
        run: |
          echo "$OZZU_TV_KEYSTORE_BASE64" | base64 -d > /tmp/ozzu-tv.keystore

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean

      - name: Build release APK
        env:
          OZZU_TV_KEYSTORE_FILE: ${{ secrets.OZZU_TV_KEYSTORE_BASE64 && '/tmp/ozzu-tv.keystore' || '' }}
          OZZU_TV_KEY_ALIAS: ${{ secrets.OZZU_TV_KEY_ALIAS }}
          OZZU_TV_KEY_PASSWORD: ${{ secrets.OZZU_TV_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease \
            -x lint -x test \
            -x checkDebugDuplicateClasses \
            -PreactNativeArchitectures=armeabi-v7a,arm64-v8a,x86_64

      - name: Compute APK metadata
        id: apk-meta
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          VERSION_CODE=$(node -e "console.log(require('./app.json').expo.android.versionCode)")
          VERSION_NAME=$(node -e "console.log(require('./app.json').expo.version)")
          SHA256=$(sha256sum "$APK" | cut -d' ' -f1)
          SIZE=$(stat -c%s "$APK")
          echo "versionCode=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "versionName=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"

      - name: Write latest.json
        run: |
          cat > /tmp/latest.json <<EOF
          {
            "versionCode": ${{ steps.apk-meta.outputs.versionCode }},
            "versionName": "${{ steps.apk-meta.outputs.versionName }}",
            "sha256": "${{ steps.apk-meta.outputs.sha256 }}",
            "size": ${{ steps.apk-meta.outputs.size }},
            "publishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      # GitHub Actions artifact storage is a small shared quota that fills up with
      # accumulated IPAs/APKs. Publish the APK + metadata as assets on the rolling
      # `tv-latest` Release instead (separate, large quota). smartDeploy pulls them
      # via `gh release download tv-latest`. (dir_1781645332787)
      - name: Publish APK + metadata to the tv-latest Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          gh release create tv-latest --prerelease --title "Ozzu TV latest" \
            --notes "Automated Ozzu TV build (rolling)" 2>/dev/null || true
          gh release upload tv-latest "$APK" /tmp/latest.json --clobber
