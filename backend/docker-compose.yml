services:
  openvpn:
    build: ./openvpn
    container_name: openvpn
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./openvpn/config:/etc/openvpn:ro
    environment:
      - TZ=${TZ}

  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:stable
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./config:/config
      - /etc/localtime:/etc/localtime:ro
    environment:
      TZ: ${TZ}
    depends_on:
      - openvpn

  nginx:
    container_name: nginx
    image: nginx:alpine
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../frontend/dist:/usr/share/nginx/dashboard:ro
      - letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - homeassistant

  bridge:
    build: ./bridge
    container_name: bridge
    restart: unless-stopped
    network_mode: host
    working_dir: /app
    volumes:
      - ./bridge:/app
      - /tmp/ozzu-bridge:/tmp/ozzu-bridge
      - /home/gcp/ozzu:/home/gcp/ozzu
      - /var/run/docker.sock:/var/run/docker.sock
      - /root/.claude:/root/.claude
      - /root/.claude.json:/root/.claude.json
      - /root/.local/share/claude:/root/.local/share/claude:ro
      - /root/.local/bin/claude:/usr/local/bin/claude:ro
      - /root/.config/gh:/root/.config/gh:ro
      - /root/.gitconfig:/root/.gitconfig:ro
      - /root/.ssh:/root/.ssh:ro
      - /usr/bin/gh:/usr/local/bin/gh:ro
      - /usr/bin/docker:/usr/local/bin/docker:ro
      - /tmp/osint-data:/tmp/osint-data
    environment:
      - BRIDGE_PIN=${BRIDGE_PIN:-1234}
      - HA_URL=${HA_URL:-http://localhost:8123}
      - HA_TOKEN=${HA_TOKEN}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-ozzu}
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY}
      - CARTESIA_API_KEY=${CARTESIA_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_ADMIN_KEY=${ANTHROPIC_ADMIN_KEY}
      - CIPHER_MODEL=${CIPHER_MODEL:-opus}
      - CIPHER_VOICE_ID=${CIPHER_VOICE_ID:-c99d36f3-5ffd-4253-803a-535c1bc9c306}
      - BRIDGE_API_KEY=${BRIDGE_API_KEY:-}
    command: sh -c "[ -d node_modules/ws ] || npm install --omit=dev; [ -d node_modules/ioredis ] || npm install --omit=dev; [ -d node_modules/pg ] || npm install --omit=dev; node server.js"
    depends_on:
      - redis
      - postgres

  postgres:
    image: postgres:16-alpine
    container_name: ozzu-postgres
    restart: unless-stopped
    network_mode: host
    shm_size: 128mb
    environment:
      - POSTGRES_DB=ozzu
      - POSTGRES_USER=ozzu
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-ozzu}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./bridge/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

  redis:
    image: redis:7-alpine
    container_name: ozzu-redis
    restart: unless-stopped
    network_mode: host
    command: redis-server --appendonly yes --maxmemory 100mb --maxmemory-policy noeviction
    volumes:
      - redis-data:/data

  osint-tools:
    build: ./osint-tools
    container_name: osint-tools
    network_mode: host
    volumes:
      - /tmp/osint-data:/tmp/osint-data
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: '2.0'
    restart: unless-stopped
    command: tail -f /dev/null

  face-recognition:
    build: ./face-recognition
    container_name: face-recognition
    restart: unless-stopped
    network_mode: host
    volumes:
      - face-models:/models
    deploy:
      resources:
        limits:
          memory: 2048M
          cpus: '2.0'
    environment:
      - MODEL_DIR=/models

  # wyze-bridge now runs on dev-01 (172.168.0.59) for LAN camera access
  # See ~/wyze-bridge/docker-compose.yml on dev-01

  certbot:
    container_name: certbot
    image: certbot/dns-cloudflare
    profiles:
      - certbot
    volumes:
      - ./nginx/cloudflare.ini:/etc/cloudflare.ini:ro
      - letsencrypt:/etc/letsencrypt
    command: certonly --dns-cloudflare --dns-cloudflare-credentials /etc/cloudflare.ini -d home.ozzu.world --non-interactive --agree-tos --email admin@ozzu.world

volumes:
  letsencrypt:
  redis-data:
  postgres-data:
  face-models:
