services:
  # openvpn: DECOMMISSIONED 2026-05-02 — replaced by WireGuard (host wg0, port udp/51820).
  # Migration: dev-01, kazuma-pc, orangepi5 are WG peers (10.9.0.4/5/6); GCP firewall
  # rule "wireguard" allows udp:51820, "allow-ozzu-public" had udp:1194 removed.
  # Server certs/configs preserved at backend/openvpn/ for archival; image build kept
  # for emergency rollback. To revive: uncomment, restore udp:1194 to allow-ozzu-public.

  # homeassistant: DECOMMISSIONED 2026-04-09 — LAN offline, moving to Spain

  nginx:
    container_name: nginx
    image: nginx:alpine
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../frontend/dist:/usr/share/nginx/dashboard:ro
      - letsencrypt:/etc/letsencrypt:ro
  bridge:
    build: ./bridge
    container_name: bridge
    restart: unless-stopped
    network_mode: host
    working_dir: /app
    # Explicitly disable auto-loading .env (it's git-crypt encrypted)
    # All config comes from inline environment vars + docker-compose.override.yml
    env_file:
      - path: .env.email
        required: false
    volumes:
      - ./bridge:/app
      - /tmp/ozzu-bridge:/tmp/ozzu-bridge
      - /home/gcp/ozzu:/home/gcp/ozzu
      - /var/run/docker.sock:/var/run/docker.sock
      - /root/.claude:/root/.claude
      - /root/.claude.json:/root/.claude.json
      - /root/.local/share/claude:/root/.local/share/claude:ro
      - /root/.local/bin/claude:/usr/local/bin/claude:ro
      - /root/.config/gh:/root/.config/gh:ro
      - /root/.config/vastai:/root/.config/vastai:ro
      - /root/.gitconfig:/root/.gitconfig:ro
      - /root/.ssh:/root/.ssh:ro
      - /usr/bin/gh:/usr/local/bin/gh:ro
      - /usr/bin/docker:/usr/local/bin/docker:ro
      - /usr/bin/adb:/usr/local/bin/adb:ro
      - /tmp/osint-data:/tmp/osint-data
      # Infra secrets — bridge code reads via lib/devices.js bootstrap
      - /root/.ozzu-secrets:/root/.ozzu-secrets:ro
    environment:
      - BRIDGE_PIN=${BRIDGE_PIN:-1234}
      - HA_URL=${HA_URL:-http://localhost:8123}
      - HA_TOKEN=${HA_TOKEN}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-ozzu}
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY}
      - CARTESIA_API_KEY=${CARTESIA_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_ADMIN_KEY=${ANTHROPIC_ADMIN_KEY}
      - CIPHER_MODEL=${CIPHER_MODEL:-opus}
      - CIPHER_VOICE_ID=${CIPHER_VOICE_ID:-c99d36f3-5ffd-4253-803a-535c1bc9c306}
      - BRIDGE_API_KEY=${BRIDGE_API_KEY:-}
      - BRIDGE_PUBLIC_URL=${BRIDGE_PUBLIC_URL:-}
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID:-}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET:-}
      - VAST_API_KEY=${VAST_API_KEY:-}
      - GMAIL_USER=${GMAIL_USER:-}
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD:-}
      - OFFENSE_MODEL_URL=${OFFENSE_MODEL_URL:-}
      - OFFENSE_MODEL_NAME=${OFFENSE_MODEL_NAME:-}
      - OFFENSE_MODEL_KEY=${OFFENSE_MODEL_KEY:-}
    command: sh -c "npm install --omit=dev --prefer-offline 2>/dev/null; node server.js"
    depends_on:
      - redis
      - postgres

  postgres:
    image: postgres:16-alpine
    container_name: ozzu-postgres
    restart: unless-stopped
    network_mode: host
    shm_size: 128mb
    environment:
      - POSTGRES_DB=ozzu
      - POSTGRES_USER=ozzu
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-ozzu}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./bridge/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

  redis:
    image: redis:7-alpine
    container_name: ozzu-redis
    restart: unless-stopped
    network_mode: host
    command: redis-server --appendonly yes --maxmemory 100mb --maxmemory-policy noeviction
    volumes:
      - redis-data:/data

  osint-tools:
    build: ./osint-tools
    container_name: osint-tools
    network_mode: host
    volumes:
      - /tmp/osint-data:/tmp/osint-data
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: '2.0'
    restart: unless-stopped
    command: tail -f /dev/null

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    network_mode: host
    volumes:
      - qdrant-data:/qdrant/storage
    deploy:
      resources:
        limits:
          memory: 4096M
          cpus: '2.0'
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333

  face-recognition:
    build: ./face-recognition
    container_name: face-recognition
    restart: unless-stopped
    network_mode: host
    volumes:
      - face-models:/models
    deploy:
      resources:
        limits:
          memory: 2048M
          cpus: '2.0'
    environment:
      - MODEL_DIR=/models
      - QDRANT_URL=http://127.0.0.1:6333

  # agrovision: DECOMMISSIONED 2026-04-09 — feature cancelled

  # Apple Anisette server — required for SideStore (iOS sideload self-refresh)
  # and AltServer-Linux. Speaks Apple's mostly-undocumented anisette protocol on
  # port 6969. No PII, no auth. Re-deployed 2026-05-16 (dir_1778958643514) —
  # previously running ad-hoc, INVENTORY had it as "✅ running" but container
  # was missing. Reachable internally as 127.0.0.1:6969; nginx exposes it as
  # https://home.ozzu.world/anisette/ for SideStore-on-cellular.
  anisette:
    container_name: anisette
    image: dadoum/anisette-v3-server:latest
    restart: unless-stopped
    network_mode: host
    volumes:
      - anisette-data:/home/Alcoholic/.config/anisette-v3
    environment:
      - ANISETTE_HOST=127.0.0.1
      - ANISETTE_PORT=6969

  browser:
    build: ./browser
    container_name: browser
    restart: unless-stopped
    network_mode: host
    volumes:
      - /tmp/browser-data:/tmp/browser-data
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: '1.5'
    environment:
      - BROWSER_PORT=3334

  # wyze-bridge — DOES NOT RUN HERE. (dir_1778948739228, 2026-05-16)
  #
  # V4 firmware ≥ 4.52.9.5332 killed the old binary-SDK TUTK path that mrlt8 and
  # IDisposable forks use (IOTC_ER_TIMEOUT). Wyze still speaks TUTK+DTLS-1.2 but
  # ThroughTek's binary SDK can't negotiate the new handshake; AlexxIT/go2rtc
  # PR #2011 (seydx, merged 2026-01-18) shipped a clean-room reimplementation
  # that works on 4.52.9.5332.
  #
  # Also: cams are on Colombian residential LAN (192.168.1.0/24). Bridge VM is
  # on GCP — cannot punch UDP to that NAT and not on the cam's LAN. So bridge
  # MUST run on a host that is on the cam's LAN.
  #
  # Deployment: alexxit/go2rtc:latest on dev-01 (10.9.0.5 over WG, 192.168.1.14
  # on FAMILIA SUAREZ WiFi — same LAN as the cam). Docker daemon enabled
  # on boot; container restart=unless-stopped auto-resurrects. Picked dev-01
  # over Kazuma-PC because Kazuma-PC moves around (laptop) while dev-01 is the
  # permanent always-on machine at King Kazuma's house.
  # Config: /home/hadmin/go2rtc/config/go2rtc.yaml on dev-01.
  # Streams: rtsp://10.9.0.5:8554/ozzu-cam-loving   (V4 2560x1440 H.264/AAC)
  #          rtsp://10.9.0.5:8554/ozzu-lroom-cam-01 (V4, offline since Feb 2026)
  # WebUI:   http://10.9.0.5:1984/
  # Creds in /root/.ozzu-secrets (WYZE_EMAIL/WYZE_PASSWORD/API_ID/API_KEY) for re-discovery if needed.

  certbot:
    container_name: certbot
    image: certbot/dns-cloudflare
    profiles:
      - certbot
    volumes:
      - ./nginx/cloudflare.ini:/etc/cloudflare.ini:ro
      - letsencrypt:/etc/letsencrypt
    command: certonly --dns-cloudflare --dns-cloudflare-credentials /etc/cloudflare.ini -d home.ozzu.world --non-interactive --agree-tos --email admin@ozzu.world

volumes:
  letsencrypt:
  redis-data:
  postgres-data:
  face-models:
  qdrant-data:
  anisette-data:
