services:
  openvpn:
    build: ./openvpn
    container_name: openvpn
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./openvpn/config:/etc/openvpn:ro
    environment:
      - TZ=${TZ}

  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:stable
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./config:/config
      - /etc/localtime:/etc/localtime:ro
    environment:
      TZ: ${TZ}
    depends_on:
      - openvpn

  nginx:
    container_name: nginx
    image: nginx:alpine
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../frontend/dist:/usr/share/nginx/dashboard:ro
      - letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - homeassistant

  certbot:
    container_name: certbot
    image: certbot/dns-cloudflare
    profiles:
      - certbot
    volumes:
      - ./nginx/cloudflare.ini:/etc/cloudflare.ini:ro
      - letsencrypt:/etc/letsencrypt
    command: certonly --dns-cloudflare --dns-cloudflare-credentials /etc/cloudflare.ini -d home.ozzu.world --non-interactive --agree-tos --email admin@ozzu.world

volumes:
  letsencrypt:
