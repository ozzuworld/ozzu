# Ozzu Device Fleet — Redroid instances
# Each device gets a unique ADB port, fingerprint, and data volume
# Usage: docker compose -f docker-compose.fleet.yml up -d redroid01 redroid02 ...

services:
  redroid01:
    image: redroid/redroid:14.0.0_litegapps_magisk
    container_name: redroid01
    privileged: true
    restart: unless-stopped
    ports:
      - "5556:5555"
    volumes:
      - redroid-data-01:/data
    command:
      - androidboot.redroid_gpu_mode=guest
      - androidboot.redroid_width=1080
      - androidboot.redroid_height=1920
      - androidboot.redroid_dpi=480
      - androidboot.redroid_fps=25
      - ro.product.model=Pixel 7
      - ro.product.manufacturer=Google
      - ro.serialno=FLEET01A1B2C3
    deploy:
      resources:
        limits:
          memory: 2048M
          cpus: '1.5'

