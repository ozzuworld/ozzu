# =========================
# OpenVPN Server (GCP VM)
# =========================

port 1194
proto udp
dev tun

user nobody
group nobody
persist-key
persist-tun

topology subnet

# VPN tunnel network
server 10.8.0.0 255.255.255.0

# =========================
# Certificates
# =========================
ca /etc/openvpn/ca.crt
cert /etc/openvpn/server.crt
key /etc/openvpn/server.key
dh /etc/openvpn/dh.pem

# TLS Authentication disabled — no client .ovpn embeds ta.key
# tls-auth /etc/openvpn/ta.key 0
# key-direction 0

# =========================
# Crypto (modern; ER605 decommissioned 2026-04-05)
# Negotiate AEAD by default; CBC kept as fallback for any legacy 2.4 client.
# auth SHA256 — modern OpenVPN3 clients (3.11+) reject SHA1 silently and fail with BUFFER_ERROR.
# =========================
cipher AES-256-CBC
data-ciphers AES-256-GCM:AES-128-GCM:AES-256-CBC
data-ciphers-fallback AES-256-CBC
auth SHA256

# =========================
# Keepalive
# =========================
keepalive 10 120

# =========================
# ROUTING
# =========================

# Allow routing between VPN clients
client-to-client

# Tell OpenVPN SERVER that these LANs exist
route 172.168.0.0 255.255.255.0
route 192.168.1.0 255.255.255.0

# Push LAN routes to VPN clients
push "route 172.168.0.0 255.255.255.0"
push "route 192.168.1.0 255.255.255.0"

# Enable client-specific routing
client-config-dir /etc/openvpn/ccd

# =========================
# DNS pushed to clients
# =========================
push "dhcp-option DNS 1.1.1.1"
push "dhcp-option DNS 8.8.8.8"

verb 4
