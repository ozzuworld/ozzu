worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # Drop requests with unknown Host header
    server {
        listen 80 default_server;
        return 444;
    }

    server {
        listen 443 ssl default_server;
        ssl_certificate /etc/letsencrypt/live/home.ozzu.world/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/home.ozzu.world/privkey.pem;
        return 444;
    }

    # Redirect HTTP → HTTPS
    server {
        listen 80;
        server_name home.ozzu.world;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name home.ozzu.world;

        # SSL certificates (managed by certbot)
        ssl_certificate /etc/letsencrypt/live/home.ozzu.world/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/home.ozzu.world/privkey.pem;

        # TLS settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # Security headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Proxy to Home Assistant
        location / {
            proxy_pass http://127.0.0.1:8123;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
