worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Rate limiting for bridge API
    limit_req_zone $binary_remote_addr zone=bridge:10m rate=30r/s;

    # Drop requests with unknown Host header
    server {
        listen 80 default_server;
        return 444;
    }

    server {
        listen 443 ssl default_server;
        ssl_certificate /etc/letsencrypt/live/home.ozzu.world/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/home.ozzu.world/privkey.pem;
        return 444;
    }

    # Redirect HTTP → HTTPS
    server {
        listen 80;
        server_name home.ozzu.world;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name home.ozzu.world;

        # SSL certificates (managed by certbot)
        ssl_certificate /etc/letsencrypt/live/home.ozzu.world/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/home.ozzu.world/privkey.pem;

        # TLS settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # Security headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Allow uploads up to 25MB (base64 overhead on 20MB files)
        client_max_body_size 25m;

        # SECURITY STOPGAP removed (dir_1780279542144) — app-layer auth now
        # enforces: BRIDGE_API_KEY is set, requireAuth gates soc/mcp/positioning
        # exec paths (401 without a valid Bearer, verified). The temporary nginx
        # 403 on those paths is no longer needed and was blocking the keyed app.

        # Bridge API reverse proxy
        location /bridge/ {
            limit_req zone=bridge burst=50 nodelay;
            proxy_pass http://127.0.0.1:3333/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # REPLACE (not append) XFF with the real peer IP so a client cannot
            # forge a trusted (WG/LAN) source — the bridge only honors XFF from
            # this loopback hop. See server.js realClientIp().
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;

            # WebSocket support (for non-/ws paths that might upgrade)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Dev mirror WebSocket — standalone mirror service (not bridge)
        location = /bridge/dev/mirror {
            proxy_pass http://127.0.0.1:3340/mirror$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
        }

        # Bridge WebSocket — dedicated block with 24h keep-alive
        location = /bridge/ws {
            proxy_pass http://127.0.0.1:3333/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
        }

        location = /bridge {
            return 301 /bridge/;
        }

        # Dashboard (static Expo build)
        location /dashboard/ {
            alias /usr/share/nginx/dashboard/;
            index index.html;
            try_files $uri $uri/ /dashboard/index.html;
        }
        location = /dashboard {
            return 301 /dashboard/;
        }

        # ── iOS sideload self-service (dir_1778958643514) ──
        # AltStore Source manifest. SideStore/AltStore polls this, sees a new
        # version, fetches /ozzu-latest.ipa, re-signs on-device. Generated by
        # bridge route GET /ozzu.json.
        location = /ozzu.json {
            proxy_pass http://127.0.0.1:3333/ozzu.json;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location = /ozzu-latest.ipa {
            proxy_pass http://127.0.0.1:3333/ozzu-latest.ipa;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 600s;
        }
        # App icon for the SideStore source manifest's iconURL field.
        # Bridge streams from frontend/assets/icon.png (same image baked into the IPA).
        location = /icon.png {
            proxy_pass http://127.0.0.1:3333/icon.png;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        # One-shot pairing-file delivery for SideStore initial setup.
        # Bridge returns 404 if token missing/wrong; deletes file after first hit.
        location = /iphone-pairing {
            proxy_pass http://127.0.0.1:3333/iphone-pairing$is_args$args;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        # Anisette server list manifest — SideStore polls this JSON for available servers
        location = /anisette-servers.json {
            proxy_pass http://127.0.0.1:3333/anisette-servers.json;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        # Alias for /anisette.json — common typo of the above. Same bridge route.
        location = /anisette.json {
            proxy_pass http://127.0.0.1:3333/anisette-servers.json;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        # iOS SideStore setup landing page — two-button HTML for King Kazuma.
        location = /ios-setup {
            proxy_pass http://127.0.0.1:3333/ios-setup$is_args$args;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        # Drag-and-drop layout designer (dir_1779020176504).
        # /designer       → HTML page
        # /designer/...   → component manifest + layout save/load endpoints
        location /designer {
            proxy_pass http://127.0.0.1:3333;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        # noVNC proxy to dev-01's X session — for running iloader GUI remotely.
        # Auth: TBD (path is obscure enough for short-term; add basic auth before
        # leaving long-term). dev-01 reachable via WG at 10.9.0.5.
        location /vnc/ {
            proxy_pass http://10.9.0.5:6080/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }
        # Self-hosted Apple anisette server (dadoum/anisette-v3-server on :6969).
        # Public path exists so SideStore on cellular can reach it without
        # putting the iPhone on WG. Anisette JSON has no PII / no auth surface.
        location /anisette/ {
            proxy_pass http://127.0.0.1:6969/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # Proxy to Home Assistant
        location / {
            proxy_pass http://127.0.0.1:8123;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
