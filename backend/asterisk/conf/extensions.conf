; ── Ozzu PBX dialplan ──

[general]
static=yes
writeprotect=no

; ── Calls from ozzu-sbc (4G gateway) ──
; GSM call → June AI receptionist (AudioSocket → Gemini Live on bridge:4580)
; June screens the call, sends briefing to app, waits for user decision.
; If transfer accepted: June ends AudioSocket gracefully, Asterisk falls
; through to Dial(ozzu-iphone) which rings the SIP-registered iPhone.
; If declined/message/spam: June hangs up from AudioSocket side.
[from-gsm]
exten => _.,1,NoOp(GSM call from ${CALLERID(num)} via ozzu-sbc gateway)
 same => n,Set(CALLER=${CALLERID(num)})
 same => n,Set(GLOBAL(LAST_GSM_CALLER)=${CALLER})
 same => n,Set(GLOBAL(LAST_GSM_CHANNEL)=${CHANNEL})
 same => n,Set(SOCKHASH=${MD5(${UNIQUEID})})
 same => n,Set(SOCKUUID=${SOCKHASH:0:8}-${SOCKHASH:8:4}-${SOCKHASH:12:4}-${SOCKHASH:16:4}-${SOCKHASH:20:12})
 ; report caller to June (keyed by the AudioSocket UUID) — synchronous so it lands before AudioSocket connects
 same => n,System(curl -sX POST http://127.0.0.1:3333/soc/calls/incoming -H 'Content-Type: application/json' -d '{"phone_number":"${CALLER}","direction":"incoming","audiosocket_uuid":"${SOCKUUID}"}')
 same => n,Answer()
 same => n,AudioSocket(${SOCKUUID},127.0.0.1:4580)
 same => n,Dial(PJSIP/ozzu-iphone,30,r)
 same => n,Hangup()

; ── Internal calls (from iPhone app via SIP) ──
[from-internal]
; Extension 601 — iPhone answering a GSM call via CallKit
; Bridge() connects the iPhone's SIP channel to the waiting GSM channel
exten => 601,1,NoOp(iPhone answering GSM call from ${GLOBAL(LAST_GSM_CALLER)})
 same => n,Answer()
 same => n,Bridge(${GLOBAL(LAST_GSM_CHANNEL)})
 same => n,Hangup()

; General internal routing
exten => _X.,1,NoOp(Internal call to ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},30,r)
 same => n,Hangup()

; Echo test
exten => 600,1,Answer()
 same => n,Echo()
 same => n,Hangup()
