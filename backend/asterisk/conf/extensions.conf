; ── Ozzu PBX dialplan ──

[general]
static=yes
writeprotect=no

; ── Calls from CAT phone (GSM gateway) ──
; Every incoming GSM call hits this context.
; Step 1: Log the call + caller ID to bridge API
; Step 2: AI screener decides: spam → hangup, legit → ring iPhone
[from-gsm]
exten => _X.,1,NoOp(GSM call from ${CALLERID(num)} via CAT gateway)
 same => n,Set(CALLER=${CALLERID(num)})
 same => n,Set(CHANNEL(language)=en)
 ; Notify bridge of incoming call
 same => n,System(curl -s -X POST http://127.0.0.1:3333/soc/calls/number -H "Content-Type: application/json" -H "Authorization: Bearer ${BRIDGE_TOKEN}" -d '{"phone_number":"${CALLER}","direction":"incoming","label":"gsm-gateway"}' &)
 ; Answer and play hold message while AI screens
 same => n,Answer()
 same => n,Playback(please-hold-while-party-contacted)
 ; AGI to AI screener (bridge decides: ring or hang up)
 same => n,AGI(agi://127.0.0.1:4573/screen,${CALLER})
 ; If AGI sets SCREEN_RESULT=pass, ring the iPhone
 same => n,GotoIf($["${SCREEN_RESULT}" = "pass"]?ring:spam)
 same => n(ring),Dial(PJSIP/ozzu-iphone,30,r)
 same => n,Hangup()
 same => n(spam),NoOp(Spam detected — hanging up)
 same => n,Playback(vm-goodbye)
 same => n,Hangup()

; ── Internal calls (iPhone to outside, or testing) ──
[from-internal]
exten => _X.,1,NoOp(Internal call to ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},30,r)
 same => n,Hangup()

; Echo test
exten => 600,1,Answer()
 same => n,Echo()
 same => n,Hangup()
