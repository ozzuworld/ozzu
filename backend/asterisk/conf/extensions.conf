; ── Ozzu PBX dialplan ──

[general]
static=yes
writeprotect=no

; ── Calls from CAT phone (GSM gateway) ──
; Every incoming GSM call hits this context.
; Step 1: Log the call + caller ID to bridge API
; Step 2: AI screener decides: spam → hangup, legit → ring iPhone
[from-gsm]
; SBC trunk: CAT sends INVITE to "incoming" — match any extension
exten => _.,1,NoOp(GSM call from ${CALLERID(num)} via CAT SBC gateway)
 same => n,Set(CALLER=${CALLERID(num)})
 same => n,Answer()
 same => n,NoOp(Call answered — echo test active, audio should be bidirectional)
 same => n,Echo()
 same => n,Hangup()

; TODO: restore AI screener + iPhone ring once echo test confirms audio works
; exten => _.,1,NoOp(GSM call from ${CALLERID(num)} via CAT gateway)
;  same => n,Set(CALLER=${CALLERID(num)})
;  same => n,Answer()
;  same => n,Playback(please-hold-while-party-contacted)
;  same => n,AGI(agi://127.0.0.1:4573/screen,${CALLER})
;  same => n,GotoIf($["${SCREEN_RESULT}" = "pass"]?ring:spam)
;  same => n(ring),Dial(PJSIP/ozzu-iphone,30,r)
;  same => n,Hangup()
;  same => n(spam),Playback(vm-goodbye)
;  same => n,Hangup()

; ── Internal calls (iPhone to outside, or testing) ──
[from-internal]
exten => _X.,1,NoOp(Internal call to ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},30,r)
 same => n,Hangup()

; Echo test
exten => 600,1,Answer()
 same => n,Echo()
 same => n,Hangup()
