; ── Ozzu PBX dialplan ──

[general]
static=yes
writeprotect=no

; ── Calls from CAT phone (GSM gateway) ──
; GSM call → notify bridge (pushes CallKit to iPhone) → ring iPhone SIP
; If iPhone isn't SIP-registered, the bridge notification still fires
; (iPhone shows CallKit via WebSocket, then calls back to pick up)
[from-gsm]
exten => _.,1,NoOp(GSM call from ${CALLERID(num)} via CAT SBC gateway)
 same => n,Set(CALLER=${CALLERID(num)})
 same => n,Set(GLOBAL(LAST_GSM_CALLER)=${CALLER})
 same => n,Set(GLOBAL(LAST_GSM_CHANNEL)=${CHANNEL})
 same => n,System(curl -sX POST http://127.0.0.1:3333/soc/calls/incoming -H "Content-Type: application/json" -d "{\"phone_number\":\"${CALLER}\",\"direction\":\"incoming\"}" &)
 same => n,Dial(PJSIP/ozzu-iphone,30,r)
 same => n,Hangup()

; ── Internal calls (iPhone to outside, or testing) ──
[from-internal]
exten => _X.,1,NoOp(Internal call to ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},30,r)
 same => n,Hangup()

; Echo test
exten => 600,1,Answer()
 same => n,Echo()
 same => n,Hangup()

