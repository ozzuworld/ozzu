; ── Ozzu PBX dialplan ──

[general]
static=yes
writeprotect=no

; ── Calls from ozzu-sbc (4G gateway) ──
; GSM call → June AI receptionist (AudioSocket → Gemini Live on bridge:4580)
; June screens the call, sends briefing to app, waits for user decision.
; If transfer accepted: June ends AudioSocket gracefully, Asterisk falls
; through to Dial(ozzu-iphone) which rings the SIP-registered iPhone.
; If declined/message/spam: June hangs up from AudioSocket side.
[from-gsm]
exten => _.,1,NoOp(GSM call from ${CALLERID(num)} via ozzu-sbc gateway)
 same => n,Set(CALLER=${CALLERID(num)})
 same => n,Set(SOCKHASH=${MD5(${UNIQUEID})})
 same => n,Set(SOCKUUID=${SOCKHASH:0:8}-${SOCKHASH:8:4}-${SOCKHASH:12:4}-${SOCKHASH:16:4}-${SOCKHASH:20:12})
 ; report caller to June (keyed by the AudioSocket UUID) — synchronous so it lands before AudioSocket connects
 same => n,System(curl -sX POST http://127.0.0.1:3333/soc/calls/incoming -H 'Content-Type: application/json' -d '{"phone_number":"${CALLER}","direction":"incoming","audiosocket_uuid":"${SOCKUUID}"}')
 same => n,Answer()
 ; June screens; on King Kazuma's accept she closes the socket with a bare FIN and we fall
 ; through to Dial. Any other end (message/spam/timeout/error) tears the channel down inside
 ; June, so we never reach Dial without an accept.
 same => n,AudioSocket(${SOCKUUID},127.0.0.1:4580)
 same => n,Dial(PJSIP/ozzu-iphone,30,r)
 ; Transfer was accepted but the iPhone didn't pick up — hand back to June in voicemail mode
 ; rather than dropping the caller. (ANSWER = the call connected; anything else = missed.)
 same => n,ExecIf($["${DIALSTATUS}" != "ANSWER"]?Goto(gsm-voicemail,${CALLER},1))
 same => n,Hangup()

; ── Missed-transfer voicemail — June takes a message when the iPhone didn't answer ──
[gsm-voicemail]
exten => _.,1,NoOp(No answer from iPhone — June voicemail for ${CALLERID(num)})
 same => n,Set(VMHASH=${MD5(${UNIQUEID}-vm)})
 same => n,Set(VMUUID=${VMHASH:0:8}-${VMHASH:8:4}-${VMHASH:12:4}-${VMHASH:16:4}-${VMHASH:20:12})
 same => n,System(curl -sX POST http://127.0.0.1:3333/soc/calls/incoming -H 'Content-Type: application/json' -d '{"phone_number":"${CALLERID(num)}","direction":"incoming","audiosocket_uuid":"${VMUUID}","mode":"voicemail"}')
 same => n,AudioSocket(${VMUUID},127.0.0.1:4580)
 same => n,Hangup()

; ── Internal calls (from iPhone app via SIP) ──
[from-internal]
; General internal routing
exten => _X.,1,NoOp(Internal call to ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},30,r)
 same => n,Hangup()

; Echo test
exten => 600,1,Answer()
 same => n,Echo()
 same => n,Hangup()

; ── Cipher AI caller test ──
; Originated leg is an AudioSocket channel to the caller-agent (127.0.0.1:4590 = "Alex").
; This context puts that synthetic caller through the SAME flow as a real GSM call:
; June screens the caller, then on her transfer the channel falls through to Dial(iPhone).
; Lets King Kazuma test the full hand-off with a single phone (Cipher drives the caller).
[test-caller]
exten => s,1,NoOp(Cipher AI caller -> June screen -> transfer to Kazuma app)
 same => n,Answer()
 same => n,Set(CALLERID(num)=3000000001)
 same => n,Set(CALLERID(name)=Cipher AI Caller)
 same => n,Set(SOCKHASH=${MD5(${UNIQUEID})})
 same => n,Set(SOCKUUID=${SOCKHASH:0:8}-${SOCKHASH:8:4}-${SOCKHASH:12:4}-${SOCKHASH:16:4}-${SOCKHASH:20:12})
 same => n,System(curl -sX POST http://127.0.0.1:3333/soc/calls/incoming -H 'Content-Type: application/json' -d '{"phone_number":"${CALLERID(num)}","caller_name":"Cipher AI Caller (Alex)","direction":"incoming","audiosocket_uuid":"${SOCKUUID}"}')
 same => n,AudioSocket(${SOCKUUID},127.0.0.1:4580)
 same => n,Dial(PJSIP/ozzu-iphone,30,r)
 same => n,Hangup()
