; ── Ozzu PBX dialplan ──

[general]
static=yes
writeprotect=no
autofallthrough=no

; ── Calls from CAT phone (GSM gateway) ──
; Flow: GSM call → notify bridge (pushes CallKit to iPhone via WS) →
;       Answer + hold caller with MusicOnHold while iPhone rings →
;       iPhone answers CallKit → SipVoipSession INVITEs ext 601 →
;       601 bridges into the waiting GSM channel
[from-gsm]
exten => _.,1,NoOp(GSM call from ${CALLERID(num)} via CAT SBC gateway)
 same => n,Set(CALLER=${CALLERID(num)})
 same => n,Set(GLOBAL(GSM_CALLER)=${CALLER})
 same => n,Set(GLOBAL(GSM_CHANNEL)=${CHANNEL})
 same => n,Answer()
 same => n,System(curl -sX POST http://127.0.0.1:3333/soc/calls/incoming -H "Content-Type: application/json" -d "{\"phone_number\":\"${CALLER}\",\"direction\":\"incoming\"}" &)
 same => n,Wait(45)
 same => n,Hangup()

; ── iPhone picks up — bridge into waiting GSM call ──
[from-internal]
exten => 601,1,NoOp(iPhone answering GSM call from ${GLOBAL(GSM_CALLER)})
 same => n,Answer()
 same => n,Bridge(${GLOBAL(GSM_CHANNEL)})
 same => n,Hangup()

; General internal dialing
exten => _X.,1,NoOp(Internal call to ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},30,r)
 same => n,Hangup()

; Echo test
exten => 600,1,Answer()
 same => n,Echo()
 same => n,Hangup()

