; ── Ozzu PBX dialplan ──

[general]
static=yes
writeprotect=no

; ── Calls from CAT phone (GSM gateway) ──
; GSM call → notify bridge (CallKit push to iPhone) → wait for iPhone callback
; Bridge notification fires curl in background, then Answer()+Wait()
; keeps the GSM channel alive while iPhone gets the CallKit notification,
; user taps answer, app INVITEs ext 601, which Bridge()s into this channel.
[from-gsm]
exten => _.,1,NoOp(GSM call from ${CALLERID(num)} via CAT SBC gateway)
 same => n,Set(CALLER=${CALLERID(num)})
 same => n,Set(GLOBAL(LAST_GSM_CALLER)=${CALLER})
 same => n,Set(GLOBAL(LAST_GSM_CHANNEL)=${CHANNEL})
 same => n,System(curl -sX POST http://127.0.0.1:3333/soc/calls/incoming -H "Content-Type: application/json" -d "{\"phone_number\":\"${CALLER}\",\"direction\":\"incoming\"}" &)
 same => n,Answer()
 same => n,Wait(45)
 same => n,Hangup()

; ── Internal calls (from iPhone app via SIP) ──
[from-internal]
; Extension 601 — iPhone answering a GSM call via CallKit
; Bridge() connects the iPhone's SIP channel to the waiting GSM channel
exten => 601,1,NoOp(iPhone answering GSM call from ${GLOBAL(LAST_GSM_CALLER)})
 same => n,Answer()
 same => n,Bridge(${GLOBAL(LAST_GSM_CHANNEL)})
 same => n,Hangup()

; General internal routing
exten => _X.,1,NoOp(Internal call to ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},30,r)
 same => n,Hangup()

; Echo test
exten => 600,1,Answer()
 same => n,Echo()
 same => n,Hangup()
