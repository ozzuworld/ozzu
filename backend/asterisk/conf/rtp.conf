[general]
; Media (RTP) port range — must match the GCP firewall UDP rule (allow-ozzu-sip).
; Public IP + rtp_symmetric on the endpoint = no TURN needed for a single NATed
; softphone talking to this public-IP Asterisk. (dir_1782911453601)
rtpstart=10000
rtpend=20000
; WebRTC negotiates ICE (DTLS-SRTP). stunaddr lets Asterisk discover its PUBLIC ip
; (the GCP VM NIC only sees the internal 10.128 ip) and offer it as an ICE candidate —
; without it a cellular WebRTC client can't reach Asterisk's media. (dir_1782922636595)
icesupport=yes
stunaddr=stun.l.google.com:19302
strictrtp=yes
