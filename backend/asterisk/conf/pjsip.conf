[global]
type=global
endpoint_identifier_order=ip,username,auth_username

; ── Ozzu PBX — PJSIP config ──
; Receives calls from ozzu-sbc (4G gateway) and routes to Ozzu app (iPhone)

; Transport — UDP on port 5060 (standard SIP)
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; Transport — WebSocket for Ozzu app (SIP over WS)
[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0:8088

; (An internet-facing TLS transport on 5061 for a native softphone was removed —
;  the iPhone leg is WebRTC over WSS/8088 via nginx, and WebRTC does its own
;  DTLS-SRTP + ICE. 5061 was unused attack surface. dir_1783001909368)

; ── ozzu-sbc (4G/GSM gateway) — SIP trunk ──
; The SBC's Asterisk (chan_quectel) sends SIP INVITEs to this endpoint. It is matched by
; its FIXED WireGuard source IP (10.9.0.21, see [ozzu-gateway-identify] below) and
; authenticates with the trunk credentials.

[ozzu-gateway]
type=endpoint
context=from-gsm
disallow=all
allow=ulaw
allow=alaw
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
auth=ozzu-gateway-auth

[ozzu-gateway-auth]
type=auth
auth_type=userpass
username=ozzu-gateway
password=ozzu-gateway-2026

; ── Ozzu iPhone app ──
; Registers via WebSocket SIP from the Ozzu app (CallKit integration)

[ozzu-iphone]
type=endpoint
context=from-internal
disallow=all
; ulaw FIRST so the WebRTC <-> GSM(ulaw) bridge negotiates ulaw and needs NO opus
; transcode (avoids the separately-installed codec_opus module). opus kept as fallback.
allow=ulaw
allow=opus
auth=ozzu-iphone-auth
; AOR must be named the same as the registering SIP user (the To-URI user 'ozzu-iphone'),
; or the registrar rejects with "AOR '' not found". (dir_1782922636595)
aors=ozzu-iphone
direct_media=no
rewrite_contact=yes
; WebRTC endpoint for the Ozzu app (react-native-webrtc + JsSIP over WSS via nginx).
; webrtc=yes enables DTLS-SRTP + ICE + AVPF + rtcp_mux — WebRTC traverses NAT itself, so
; NO WireGuard is needed for this leg; the app reaches us over public wss://. Asterisk
; bridges this endpoint to the inbound GSM SIP call. (dir_1782922636595)
webrtc=yes
dtls_auto_generate_cert=yes

[ozzu-iphone-auth]
type=auth
auth_type=userpass
username=ozzu-iphone
; Strong random secret — this endpoint is internet-facing (WebRTC over WSS/443). Rotated
; off the guessable ozzu-sip-2026 pattern. (dir_1782911453601)
password=75134ecdccb72682abe5b3af85955ebb090b

[ozzu-iphone]
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=30

; Identify the SBC trunk by its FIXED WireGuard IP (stable, unlike the old CAT phone)
[ozzu-gateway-identify]
type=identify
endpoint=ozzu-gateway
match=10.9.0.21
