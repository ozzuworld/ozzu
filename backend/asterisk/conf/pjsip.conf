[global]
type=global
endpoint_identifier_order=ip,username,auth_username

; ── Ozzu PBX — PJSIP config ──
; Receives calls from ozzu-sbc (4G gateway) and routes to Ozzu app (iPhone)

; Transport — UDP on port 5060 (standard SIP)
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; Transport — WebSocket for Ozzu app (SIP over WS)
[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0:8088

; Transport — TLS on 5061 for an internet-facing native softphone (Linphone/Groundwire).
; TLS protects the SIP credentials on the wire (never expose plain UDP 5060 publicly —
; SIP scanners hammer it). Cert = the letsencrypt cert for home.ozzu.world. asterisk
; runs as the non-root 'asterisk' user and can't read letsencrypt's 600 root privkey,
; so fullchain+privkey are COPIED to /etc/asterisk/certs (644). On renewal, re-copy +
; `pjsip reload` (TODO: post-renewal hook; cert valid to ~mid-Sep 2026).
; external_* advertise the GCP PUBLIC ip in SDP/Contact — the VM NIC only sees the
; internal 10.128 ip, so without this a remote phone gets ONE-WAY / no audio.
; local_net keeps the WG trunk (10.9.0.21 SBC) and GCP-internal peers un-NATed so the
; existing GSM path is unaffected. (dir_1782911453601)
[transport-tls]
type=transport
protocol=tls
bind=0.0.0.0:5061
cert_file=/etc/asterisk/certs/fullchain.pem
priv_key_file=/etc/asterisk/certs/privkey.pem
method=tlsv1_2
external_media_address=34.10.215.92
external_signaling_address=34.10.215.92
local_net=10.9.0.0/24
local_net=10.128.0.0/9

; ── ozzu-sbc (4G/GSM gateway) — SIP trunk, auth-based ──
; The SBC's Asterisk (chan_quectel) sends SIP INVITEs in with these
; credentials. Identified by SIP auth username, NOT source IP — so the
; SBC's address can change on the WG mesh without breaking the trunk.

[ozzu-gateway]
type=endpoint
context=from-gsm
disallow=all
allow=ulaw
allow=alaw
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
auth=ozzu-gateway-auth

[ozzu-gateway-auth]
type=auth
auth_type=userpass
username=ozzu-gateway
password=ozzu-gateway-2026

; ── Ozzu iPhone app ──
; Registers via WebSocket SIP from the Ozzu app (CallKit integration)

[ozzu-iphone]
type=endpoint
context=from-internal
disallow=all
; ulaw FIRST so the WebRTC <-> GSM(ulaw) bridge negotiates ulaw and needs NO opus
; transcode (avoids the separately-installed codec_opus module). opus kept as fallback.
allow=ulaw
allow=opus
auth=ozzu-iphone-auth
; AOR must be named the same as the registering SIP user (the To-URI user 'ozzu-iphone'),
; or the registrar rejects with "AOR '' not found". (dir_1782922636595)
aors=ozzu-iphone
direct_media=no
rewrite_contact=yes
; WebRTC endpoint for the Ozzu app (react-native-webrtc + JsSIP over WSS via nginx).
; webrtc=yes enables DTLS-SRTP + ICE + AVPF + rtcp_mux — WebRTC traverses NAT itself, so
; NO WireGuard is needed for this leg; the app reaches us over public wss://. Asterisk
; bridges this endpoint to the inbound GSM SIP call. (dir_1782922636595)
webrtc=yes
dtls_auto_generate_cert=yes

[ozzu-iphone-auth]
type=auth
auth_type=userpass
username=ozzu-iphone
; Strong random secret — this endpoint is internet-facing (TLS 5061). Rotated off the
; guessable ozzu-sip-2026 pattern. (dir_1782911453601)
password=75134ecdccb72682abe5b3af85955ebb090b

[ozzu-iphone]
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=30

; ── Bridge internal (for AI screener AGI) ──
[bridge-agent]
type=endpoint
context=from-internal
disallow=all
allow=ulaw
allow=alaw
auth=bridge-agent-auth
aors=bridge-agent-aor
direct_media=no

[bridge-agent-auth]
type=auth
auth_type=userpass
username=bridge-agent
password=ozzu-bridge-2026

[bridge-agent-aor]
type=aor
max_contacts=1
remove_existing=yes

; Identify the SBC trunk by its FIXED WireGuard IP (stable, unlike the old CAT phone)
[ozzu-gateway-identify]
type=identify
endpoint=ozzu-gateway
match=10.9.0.21
