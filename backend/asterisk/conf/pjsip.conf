[global]
type=global
endpoint_identifier_order=ip,username,auth_username

; ── Ozzu PBX — PJSIP config ──
; Receives calls from ozzu-sbc (4G gateway) and routes to Ozzu app (iPhone)

; Transport — UDP on port 5060 (standard SIP)
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; Transport — WebSocket for Ozzu app (SIP over WS)
[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0:8088

; ── ozzu-sbc (4G/GSM gateway) — SIP trunk, auth-based ──
; The SBC's Asterisk (chan_quectel) sends SIP INVITEs in with these
; credentials. Identified by SIP auth username, NOT source IP — so the
; SBC's address can change on the WG mesh without breaking the trunk.

[ozzu-gateway]
type=endpoint
context=from-gsm
disallow=all
allow=ulaw
allow=alaw
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
auth=ozzu-gateway-auth

[ozzu-gateway-auth]
type=auth
auth_type=userpass
username=ozzu-gateway
password=ozzu-gateway-2026

; ── Ozzu iPhone app ──
; Registers via WebSocket SIP from the Ozzu app (CallKit integration)

[ozzu-iphone]
type=endpoint
context=from-internal
disallow=all
allow=ulaw
allow=alaw
allow=opus
auth=ozzu-iphone-auth
aors=ozzu-iphone-aor
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
webrtc=yes

[ozzu-iphone-auth]
type=auth
auth_type=userpass
username=ozzu-iphone
password=ozzu-sip-2026

[ozzu-iphone-aor]
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=30

; ── Bridge internal (for AI screener AGI) ──
[bridge-agent]
type=endpoint
context=from-internal
disallow=all
allow=ulaw
allow=alaw
auth=bridge-agent-auth
aors=bridge-agent-aor
direct_media=no

[bridge-agent-auth]
type=auth
auth_type=userpass
username=bridge-agent
password=ozzu-bridge-2026

[bridge-agent-aor]
type=aor
max_contacts=1
remove_existing=yes

; Identify the SBC trunk by its FIXED WireGuard IP (stable, unlike the old CAT phone)
[ozzu-gateway-identify]
type=identify
endpoint=ozzu-gateway
match=10.9.0.21
