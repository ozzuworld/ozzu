; ── Ozzu PBX — PJSIP config ──
; Receives calls from CAT phone (GSM gateway) and routes to Ozzu app (iPhone)

; Transport — UDP on port 5060 (standard SIP)
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; ── CAT phone (GSM gateway) — SBC trunk mode ──
; The CAT sends SIP INVITE directly (no registration), identified by IP.
; No auth needed — trusted by source IP on the WG mesh.

[cat-gateway]
type=endpoint
context=from-gsm
disallow=all
allow=ulaw
allow=alaw
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[cat-gateway-identify]
type=identify
endpoint=cat-gateway
match=10.9.0.22

; ── Ozzu iPhone app ──
; The Ozzu app on iPhone registers as a SIP extension

[ozzu-iphone]
type=endpoint
context=from-internal
disallow=all
allow=ulaw
allow=alaw
allow=opus
auth=ozzu-iphone-auth
aors=ozzu-iphone-aor
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[ozzu-iphone-auth]
type=auth
auth_type=userpass
username=ozzu-iphone
password=ozzu-sip-2026

[ozzu-iphone-aor]
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=30

; ── Bridge internal (for AI screener AGI) ──
[bridge-agent]
type=endpoint
context=from-internal
disallow=all
allow=ulaw
allow=alaw
auth=bridge-agent-auth
aors=bridge-agent-aor
direct_media=no

[bridge-agent-auth]
type=auth
auth_type=userpass
username=bridge-agent
password=ozzu-bridge-2026

[bridge-agent-aor]
type=aor
max_contacts=1
remove_existing=yes
