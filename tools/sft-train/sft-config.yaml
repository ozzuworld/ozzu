# LLaMA-Factory training config — Sprint 3 SFT on Qwen3-Coder-30B
# Place this on the MI300X droplet at /root/sft-out/sft-config.yaml

### Model + tokenizer
model_name_or_path: /model              # mounted Qwen3-Coder-30B-A3B-Instruct-FP8
trust_remote_code: true

### Method (QLoRA — base in 4-bit, LoRA in fp16)
stage: sft
do_train: true
finetuning_type: lora
lora_target: all                         # all attention + MLP linear layers
lora_rank: 32
lora_alpha: 64
lora_dropout: 0.05
quantization_bit: 4
quantization_type: nf4
double_quantization: true

### Dataset (JSONL ChatML format)
dataset_dir: /data
dataset: sft-train
template: qwen                            # matches Qwen3 chat template
cutoff_len: 4096
max_samples: null                         # use all
overwrite_cache: true
preprocessing_num_workers: 8
packing: false                            # don't pack — chat templates fragile

### Training hyperparameters
output_dir: /sft-out/qwen3coder-sft
logging_dir: /sft-out/qwen3coder-sft/logs
per_device_train_batch_size: 4
gradient_accumulation_steps: 4            # effective batch 16
learning_rate: 2.0e-5
num_train_epochs: 3
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true                                # MI300X supports BF16 well
weight_decay: 0.01
gradient_checkpointing: true              # save memory
max_grad_norm: 1.0

### Eval (held-out 10% from format-sft.js)
do_eval: true
eval_dataset: sft-eval
per_device_eval_batch_size: 8
eval_strategy: steps
eval_steps: 50

### Logging + checkpoints
logging_steps: 5
save_strategy: epoch
save_total_limit: 2
plot_loss: true

### Optimizer
optim: paged_adamw_8bit                  # bitsandbytes-rocm 8-bit optimizer
adam_beta1: 0.9
adam_beta2: 0.999
adam_epsilon: 1.0e-8

### Misc
seed: 42
disable_tqdm: false
report_to: none
